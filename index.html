<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barış'ı Topluluğa Çağır</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: linear-gradient(180deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%);
      font-family: 'Fredoka', 'Nunito', sans-serif;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .top-badge {
      background: #b2dfdb;
      color: #00796b;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 20px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .main-title {
      font-size: 34px;
      font-weight: 800;
      color: #00695c;
      margin-bottom: 20px;
      text-align: center;
    }

    .photo-card-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin-bottom: 24px;
    }

    .photo-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 16px 16px 12px 16px;
      box-shadow: 0 10px 25px rgba(0, 150, 136, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .photo-wrapper {
      width: 100%;
      height: 300px;
      border-radius: 20px;
      overflow: hidden;
      background: #f0f0f0;
      position: relative;
      cursor: pointer;
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name-label {
      font-size: 20px;
      font-weight: 800;
      color: #4a4a4a;
      margin-top: 10px;
    }

    .call-badge {
      position: absolute;
      top: -12px;
      right: -12px;
      background: #ffffff;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      z-index: 10;
      animation: floatBadge 2.5s infinite ease-in-out;
    }

    @keyframes floatBadge {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.08); }
    }

    .pop-forward {
      animation: popAndBack 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.3) !important;
    }

    @keyframes popAndBack {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); box-shadow: 0 20px 40px rgba(0, 137, 123, 0.3); }
      100% { transform: scale(1); }
    }

    .call-btn {
      width: 100%;
      max-width: 320px;
      background: linear-gradient(135deg, #00897b 0%, #26a69a 100%);
      color: #ffffff;
      border: none;
      padding: 18px;
      border-radius: 50px;
      font-size: 24px;
      font-weight: 800;
      font-family: 'Fredoka', sans-serif;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 137, 123, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease;
    }

    .call-btn:active {
      transform: scale(0.96);
    }

    .counter {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
      color: #00796b;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      animation: explode 0.8s ease-out forwards;
      font-size: 26px;
    }

    @keyframes explode {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5); }
    }
  </style>
</head>
<body>

  <div class="top-badge">TOPLULUK PORTALI</div>
  <h1 class="main-title">Barış'ı Topluluğa Çağır!</h1>

  <div class="photo-card-container">
    <div class="call-badge">📢</div>
    <div class="photo-card" id="photo-card">
      <div class="photo-wrapper" id="photo-click">
        <!-- GitHub'daki fotoğraf dosya adı[span_2](start_span)[span_2](end_span) -->
        <img src="a6953c2052426997626e300fc363fe35 (1).jpg" alt="Barış">
      </div>
      <div class="name-label">Barış</div>
    </div>
  </div>

  <button class="call-btn" id="call-btn">
    📢 Barış'ı Çağır!
  </button>

  <div class="counter">Toplam Çağrı: <span id="count">0</span></div>

  <script>
    const btn = document.getElementById('call-btn');
    const photoCard = document.getElementById('photo-card');
    const photoClick = document.getElementById('photo-click');
    const countEl = document.getElementById('count');

    // GitHub'daki mp4 video dosyasından ses oynatma[span_3](start_span)[span_3](end_span)
    const barisAudio = new Audio('71621ff912f49787f12b8cc4c82d6e30.mp4');

    let count = 0;

    function playSound() {
      barisAudio.currentTime = 0;
      barisAudio.play().catch(() => {});
    }

    function createEffects(x, y) {
      const items = ['📢', '✨', '💬', '🚀', '⭐', '🔥'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.innerText = items[Math.floor(Math.random() * items.length)];
        
        const angle = (Math.PI * 2 * i) / 12;
        const dist = 80 + Math.random() * 50;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    function triggerCall(e) {
      count++;
      countEl.innerText = count;

      photoCard.classList.remove('pop-forward');
      void photoCard.offsetWidth;
      photoCard.classList.add('pop-forward');

      const rect = photoCard.getBoundingClientRect();
      const clickX = e.clientX || rect.left + rect.width / 2;
      const clickY = e.clientY || rect.top + rect.height / 2;

      createEffects(clickX, clickY);
      playSound();
    }

    btn.addEventListener('click', triggerCall);
    photoClick.addEventListener('click', triggerCall);
  </script>
</body>
</html>
