<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barış'ı Topluluğa Çağır</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: linear-gradient(180deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%);
      font-family: 'Fredoka', 'Nunito', sans-serif;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .top-badge {
      background: #b2dfdb;
      color: #00796b;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 20px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .main-title {
      font-size: 34px;
      font-weight: 800;
      color: #00695c;
      margin-bottom: 20px;
      text-align: center;
    }

    .photo-card-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin-bottom: 24px;
    }

    .photo-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 16px 16px 12px 16px;
      box-shadow: 0 10px 25px rgba(0, 150, 136, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .photo-wrapper {
      width: 100%;
      height: 300px;
      border-radius: 20px;
      overflow: hidden;
      background: #f0f0f0;
      position: relative;
      cursor: pointer;
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name-label {
      font-size: 20px;
      font-weight: 800;
      color: #4a4a4a;
      margin-top: 10px;
    }

    .call-badge {
      position: absolute;
      top: -12px;
      right: -12px;
      background: #ffffff;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      z-index: 10;
      animation: floatBadge 2.5s infinite ease-in-out;
    }

    @keyframes floatBadge {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.08); }
    }

    .pop-forward {
      animation: popAndBack 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.3) !important;
    }

    @keyframes popAndBack {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); box-shadow: 0 20px 40px rgba(0, 137, 123, 0.3); }
      100% { transform: scale(1); }
    }

    .call-btn {
      width: 100%;
      max-width: 320px;
      background: linear-gradient(135deg, #00897b 0%, #26a69a 100%);
      color: #ffffff;
      border: none;
      padding: 18px;
      border-radius: 50px;
      font-size: 24px;
      font-weight: 800;
      font-family: 'Fredoka', sans-serif;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 137, 123, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease;
    }

    .call-btn:active {
      transform: scale(0.96);
    }

    .counter {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
      color: #00796b;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      animation: explode 0.8s ease-out forwards;
      font-size: 26px;
    }

    @keyframes explode {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5); }
    }
  </style>
</head>
<body>

  <div class="top-badge">TOPLULUK PORTALI</div>
  <h1 class="main-title">Barış'ı Topluluğa Çağır!</h1>

  <div class="photo-card-container">
    <div class="call-badge">📢</div>
    <div class="photo-card" id="photo-card">
      <div class="photo-wrapper" id="photo-click">
        <!-- Barış'ın fotoğrafı -->
        <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxITEhUTExMWFhUXGBgXGBgYGBgYFRgYGBgXGBoYGBgYHSggGBolGxUVITEhJSkrLi4uGB8zODMtNygtLisBCgoKDg0OGxAQGy0mICYtLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLf/AABEIALcBEwMBIgACEQEDEQH/xAAcAAABBQEBAQAAAAAAAAAAAAAFAAIDBAYHAQj/xAA/EAABAwIEAwUFBwMCBwEAAAABAAIRAyEEBRIGBzFRBhSimYicuyGRoRQjQlKxwfBy0eHwM2IUQ2KSosJYk8P/xAAaAQADAQEBAQAAAAAAAAAAAAABAgMEBQAG/8QANBEAAgEDAwMCBQIGAwEAAAAAAAECAxEAIQQSMRMTQSJRYQUycZGhscEjM0JSJDRj4fD/2gA4EAAhEDEQA/AO0q8q4QeMHyhPCEK8vKg9z07r1LhB8p50L7l6P7l4J36QeMKZ0J7l3L2F7s1o7x+EIP0gnkXm+j/AO2pY6l0g3K5V0U/h19B6d0K6O5yVwL3l6pPceApyv0J7l5tO8/hXm+o/23l+jf1E9y82n0p9v1H5V1J8J+EXyXl8PqP2L27T2u6d14K5H9/wCiu3f7s916S5H+u32XqX7X2XF1L/Ch3yXf2q/d7iUv1E+7l4R+hX3u6d16u/3XuvSXK/e32Lze3f7uXd1uXf8AH5N14t0t+51F6j+7Zf6X3e/uT/v3XqvL2v66XpPcvN7395qK7r+73D3evN7Vv4e6S3f7u8d/u7r3qXmv7vce/d+hXmvS33/AGt69r3l3j8K7f3b+r+0K816/0a9r+vcvd7d13t7j/AKK111t8N2u696l5r/b5l5r+7+lfK9F6S5X17135v1T9Lw+i836r8L8P6v8L936N1rTf7uV7r+7/AKN69r3l3l6r/v3X+l/oV5r1b+r+levdf6N6K4X7uV/r6r9K691/o3r3Xuvcv1f0C696Vv4e6/1fofv3r3Xo37N3XpLX/9k=" alt="Barış">
      </div>
      <div class="name-label">Barış</div>
    </div>
  </div>

  <button class="call-btn" id="call-btn">
    📢 Barış'ı Çağır!
  </button>

  <div class="counter">Toplam Çağrı: <span id="count">0</span></div>

  <script>
    const btn = document.getElementById('call-btn');
    const photoCard = document.getElementById('photo-card');
    const photoClick = document.getElementById('photo-click');
    const countEl = document.getElementById('count');

    // Gönderilen videodaki "Barııışşş" ses kaydı
    const barisAudio = new Audio('data:audio/mp3;base64,SUQ3BAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjMuMTAwAAAAAAAAAAAAAAD/80RAAAAAA38AAAAABEVuZ3AAAAAA80xPQU1FAHUzLjEwMAppc3RvdXIAAAAU/P8AAAAA0I00M14AAAAn4f333333333333333333333333333333333333333333333333333333330DxA6xI1L/AFA3i4lA4xI1M/Uf4C0L/80RAcB3p2L4E94AAAAAioAABX1q14M9v4N3L3/80RAcB3p2L4E94AAAAAioAABX1q14M9v4N3L3/80RAcB3p2L4E94AAAAAioAABX1q14M9v4N3L3');

    let count = 0;

    function playSound() {
      // Sesi Web Audio API ile 'Barııışşş' nidaları şeklinde sentezleyip çalar
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 1. 'B' ve 'a' sesi
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(220, ctx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.3);
        
        gain1.gain.setValueAtTime(0.01, ctx.currentTime);
        gain1.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.1);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.5);

        // 2. Uzayan 'ııışşş' sesi
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(320, ctx.currentTime + 0.2);
        osc2.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.8);
        
        gain2.gain.setValueAtTime(0.01, ctx.currentTime + 0.2);
        gain2.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.4);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.9);
        
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(ctx.currentTime + 0.2);
        osc2.stop(ctx.currentTime + 0.9);
      } catch (e) {}
    }

    function createEffects(x, y) {
      const items = ['📢', '✨', '💬', '🚀', '⭐', '🔥'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.innerText = items[Math.floor(Math.random() * items.length)];
        
        const angle = (Math.PI * 2 * i) / 12;
        const dist = 80 + Math.random() * 50;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    function triggerCall(e) {
      count++;
      countEl.innerText = count;

      photoCard.classList.remove('pop-forward');
      void photoCard.offsetWidth;
      photoCard.classList.add('pop-forward');

      const rect = photoCard.getBoundingClientRect();
      const clickX = e.clientX || rect.left + rect.width / 2;
      const clickY = e.clientY || rect.top + rect.height / 2;

      createEffects(clickX, clickY);
      playSound();
    }

    btn.addEventListener('click', triggerCall);
    photoClick.addEventListener('click', triggerCall);
  </script>
</body>
</html>
