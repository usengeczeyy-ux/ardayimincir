<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arda'yı Mıncır 🤏🏻</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
      font-family: 'Fredoka', 'Nunito', sans-serif;
      overflow-x: hidden;
      position: relative;
      padding: 20px 0;
    }

    /* Arka plan kalpleri */
    .bg-heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.4);
      font-size: 24px;
      pointer-events: none;
      animation: floatUp 8s infinite linear;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% {
        transform: translateY(-10vh) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }

    .main-card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 36px;
      border: 3px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 50px rgba(230, 80, 120, 0.25);
      max-width: 90vw;
      width: 380px;
    }

    /* Ses Seçim Kutusu */
    .sound-selector-container {
      width: 100%;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .sound-label {
      font-size: 14px;
      font-weight: 700;
      color: #c2185b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sound-select {
      width: 100%;
      padding: 10px 16px;
      border-radius: 20px;
      border: 2px solid #ff69b4;
      background: rgba(255, 255, 255, 0.9);
      color: #d63384;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 15px;
      outline: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.15);
      transition: all 0.2s ease;
      text-align: center;
    }

    .sound-select:hover {
      background: #ffffff;
      border-color: #ff1493;
    }

    /* Foto alanı */
    .img-wrapper {
      position: relative;
      width: 100%;
      height: 420px;
      border-radius: 24px;
      overflow: visible;
      cursor: pointer;
      perspective: 1000px;
    }

    .arda-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      border: 4px solid #ffffff;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Kenardaki 🤏🏻 emojisi */
    .pinch-badge {
      position: absolute;
      top: -15px;
      right: -15px;
      font-size: 42px;
      background: #ffffff;
      width: 65px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(255, 105, 180, 0.4);
      border: 3px solid #ff69b4;
      z-index: 20;
      transition: transform 0.2s ease;
      animation: pulsePinch 2s infinite ease-in-out;
    }

    @keyframes pulsePinch {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.1) rotate(12deg); }
    }

    /* Öne gelip çekilme animasyonu */
    .pop-forward {
      animation: popAndShrink 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.4) !important;
    }

    @keyframes popAndShrink {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.22) translateZ(40px);
        box-shadow: 0 25px 50px rgba(255, 20, 147, 0.4);
      }
      100% {
        transform: scale(1);
      }
    }

    /* İsim yazısı */
    .name-title {
      font-size: 20px;
      font-weight: 700;
      color: #d63384;
      margin-top: 14px;
      margin-bottom: 16px;
      text-transform: lowercase;
      letter-spacing: 1px;
      opacity: 0.9;
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
    }

    /* Mıncır Butonu */
    .mincir-btn {
      background: linear-gradient(135deg, #ff4081 0%, #ff69b4 100%);
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 22px;
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 64, 129, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      outline: none;
    }

    .mincir-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 14px 30px rgba(255, 64, 129, 0.5);
    }

    .mincir-btn:active {
      transform: translateY(2px) scale(0.96);
    }

    /* Sayaç */
    .counter {
      margin-top: 12px;
      font-size: 14px;
      color: #c2185b;
      font-weight: 600;
    }

    /* Kalp Efektleri */
    .burst-particle {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      animation: explode 0.8s ease-out forwards;
      font-size: 26px;
    }

    @keyframes explode {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.5) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(1.6) rotate(var(--rot));
      }
    }
  </style>
</head>
<body>

  <!-- Arka Plan Kalpleri -->
  <div id="bg-hearts"></div>

  <div class="main-card">
    
    <!-- Ses Seçimi -->
    <div class="sound-selector-container">
      <label class="sound-label" for="sound-select">🔊 mıncırma sesi seç</label>
      <select id="sound-select" class="sound-select">
        <option value="letsgo">a aa lets go mu🥺</option>
        <option value="squish">🤏🏻 Cıvık Mıncır Sesi</option>
        <option value="pop">💖 Sevgi Kalp Sesi</option>
      </select>
    </div>

    <!-- Fotoğraf Alanı -->
    <div class="img-wrapper" id="img-wrapper">
      <div class="pinch-badge" id="pinch-badge">🤏🏻</div>
      <img id="arda-photo" src="HVbmCDJWMAEtK1r.jpg" alt="arda" class="arda-img">
    </div>

    <div class="name-title">arda</div>

    <button class="mincir-btn" id="mincir-btn">
      ardayı mıncır 🤏🏻
    </button>

    <div class="counter" id="counter-text">toplam mıncırma: <span id="count">0</span></div>
  </div>

  <script>
    // Arka plan kalplerini oluştur
    const bgContainer = document.getElementById('bg-hearts');
    const hearts = ['💖', '💕', '💗', '💓', '🌸', '✨'];
    for (let i = 0; i < 15; i++) {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDelay = Math.random() * 5 + 's';
      heart.style.animationDuration = (6 + Math.random() * 4) + 's';
      bgContainer.appendChild(heart);
    }

    const img = document.getElementById('arda-photo');
    const btn = document.getElementById('mincir-btn');
    const badge = document.getElementById('pinch-badge');
    const countEl = document.getElementById('count');
    const wrapper = document.getElementById('img-wrapper');
    const soundSelect = document.getElementById('sound-select');

    // X/Twitter Video Ses Dosyası
    const letsGoAudio = new Audio('https://twitsave.com/download?url=https://x.com/furyanapti/status/2099898994893758576/video/1');

    let mıncırCount = 0;

    // Ses Çalma Fonksiyonu
    function playSelectedSound() {
      const selected = soundSelect.value;

      if (selected === 'letsgo') {
        letsGoAudio.currentTime = 0;
        letsGoAudio.play().catch(() => {
          // Tarayıcı kısıtlaması olursa yedek cıvık ses çalsın
          playSynthesizedSound('squish');
        });
      } else {
        playSynthesizedSound(selected);
      }
    }

    // Web Audio Efektleri
    function playSynthesizedSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        if (type === 'squish') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(350, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.18);
          gain.gain.setValueAtTime(0.4, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
        } else if (type === 'pop') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
        }
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
    }

    // Patlama efektleri
    function createBurst(x, y) {
      const particles = ['💖', '💕', '💓', '💗', '🤏🏻', '✨', '🌸', '🥺'];
      for (let i = 0; i < 12; i++) {
        const particle = document.createElement('div');
        particle.className = 'burst-particle';
        particle.innerText = particles[Math.floor(Math.random() * particles.length)];
        
        const angle = (Math.PI * 2 * i) / 12;
        const velocity = 80 + Math.random() * 60;
        const dx = Math.cos(angle) * velocity + 'px';
        const dy = Math.sin(angle) * velocity + 'px';
        const rot = (Math.random() * 360 - 180) + 'deg';
        
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.setProperty('--dx', dx);
        particle.style.setProperty('--dy', dy);
        particle.style.setProperty('--rot', rot);
        
        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 800);
      }
    }

    // Mıncırma Tıklama Mantığı
    function doMincir(e) {
      mıncırCount++;
      countEl.innerText = mıncırCount;

      img.classList.remove('pop-forward');
      void img.offsetWidth;
      img.classList.add('pop-forward');

      badge.style.transform = 'scale(1.4) rotate(-20deg)';
      setTimeout(() => {
        badge.style.transform = '';
      }, 200);

      const rect = img.getBoundingClientRect();
      const clickX = e ? e.clientX : rect.left + rect.width / 2;
      const clickY = e ? e.clientY : rect.top + rect.height / 2;
      
      createBurst(clickX, clickY);
      playSelectedSound();
    }

    btn.addEventListener('click', doMincir);
    wrapper.addEventListener('click', doMincir);
  </script>
</body>
</html>
