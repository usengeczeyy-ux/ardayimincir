```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arda'yı Mıncır 🤏🏻</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Pacifico & Fredoka & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Pacifico&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 50%, #ffb6c1 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Yüzen Tatlı Arka Plan Kalpleri */
        .bg-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            animation: floatHeart 8s infinite linear;
            z-index: 0;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Glassmorphism pembe kart */
        .glass-card {
            background: rgba(255, 240, 245, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 25px 50px -12px rgba(236, 72, 153, 0.35);
        }

        /* Fotoğraf Öne Gelip Geri Çekilme Animasyonu */
        .pop-forward {
            animation: popForwardEffect 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popForwardEffect {
            0% {
                transform: scale(1) translateZ(0);
            }
            50% {
                transform: scale(1.28) translateY(-10px) rotate(-1deg);
                box-shadow: 0 35px 60px -15px rgba(219, 39, 119, 0.5);
                z-index: 30;
            }
            100% {
                transform: scale(1) translateZ(0);
                box-shadow: 0 20px 30px -10px rgba(219, 39, 119, 0.25);
                z-index: 10;
            }
        }

        /* Köşedeki 🤏🏻 Emojisinin Mıncırma Animasyonu */
        .pinch-squeeze {
            animation: pinchSqueezeAnim 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pinchSqueezeAnim {
            0% {
                transform: scale(1) rotate(0deg);
            }
            40% {
                transform: scale(1.7) rotate(-25deg) translate(-8px, 8px);
            }
            70% {
                transform: scale(1.4) rotate(10deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* Ekrana Dağılan Kalpler & Emojiler */
        .burst-emoji {
            position: fixed;
            pointer-events: none;
            z-index: 99;
            animation: burstAndFade 1.1s ease-out forwards;
            font-size: 2rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        @keyframes burstAndFade {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.4) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(var(--rot));
            }
            100% {
                opacity: 0;
                transform: translate(calc(var(--dx) * 1.4), calc(var(--dy) - 60px)) scale(0.9) rotate(calc(var(--rot) * 2));
            }
        }

        /* Tatlı Büyük Buton Stil & Efektleri */
        .pink-cute-btn {
            background: linear-gradient(135deg, #ff4b8b 0%, #ff758c 50%, #ff8efa 100%);
            box-shadow: 0 12px 28px rgba(255, 75, 139, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.6);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pink-cute-btn:hover {
            transform: translateY(-4deg) scale(1.03);
            box-shadow: 0 18px 36px rgba(255, 75, 139, 0.55), inset 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        .pink-cute-btn:active {
            transform: translateY(2deg) scale(0.96);
            box-shadow: 0 6px 16px rgba(255, 75, 139, 0.35);
        }

        .pacifico-title {
            font-family: 'Pacifico', cursive;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 select-none overflow-hidden">

    <!-- Arka Plan Yüzen Kalpler (JS ile doldurulacak) -->
    <div id="bgHeartsContainer" class="fixed inset-0 pointer-events-none"></div>

    <!-- Ana Kart Konteyner -->
    <div class="relative z-10 glass-card rounded-3xl p-6 sm:p-8 max-w-md w-full text-center flex flex-col items-center border-4 border-white/80">
        
        <!-- Büyük Dikdörtgen Fotoğraf Alanı -->
        <div id="imageCard" class="relative group cursor-pointer w-full max-w-xs mb-4">
            
            <!-- Dikdörtgen Fotoğraf Çerçevesi -->
            <div class="relative w-full h-80 sm:h-96 rounded-2xl overflow-hidden border-4 border-white shadow-xl transition-all duration-300 bg-pink-200 flex items-center justify-center">
                <img id="ardaImg" 
                     src="HVbmCDJWMAEtK1r.jpg" 
                     alt="Arda" 
                     class="w-full h-full object-cover rounded-xl"
                     onerror="this.src='HVbmCDJWMAEtK1r.jpg'">
            </div>

            <!-- Fotonun Yanında/Köşesinde Sabit Mıncırma Emojisi 🤏🏻 -->
            <div id="cornerPinchEmoji" class="absolute -top-4 -right-4 text-5xl sm:text-6xl drop-shadow-lg transition-transform duration-200 pointer-events-none z-20">
                🤏🏻
            </div>
        </div>

        <!-- Küçük Yazı: arda -->
        <h1 class="text-3xl font-bold text-pink-600 tracking-wider mb-0.5 lowercase pacifico-title drop-shadow-sm">arda</h1>
        <p class="text-xs text-pink-400 font-semibold tracking-widest uppercase mb-6">özel mıncırma köşesi</p>

        <!-- Büyük Tatlı Buton: ardayı mıncır🤏🏻 -->
        <button id="mincirBtn" class="pink-cute-btn w-full py-4 px-6 rounded-2xl text-white font-extrabold text-xl tracking-wide flex items-center justify-center gap-3 cursor-pointer border-2 border-white/60">
            <span>ardayı mıncır</span>
            <span class="text-2xl drop-shadow">🤏🏻</span>
        </button>

        <!-- Mıncırma Sayacı -->
        <div class="mt-5 text-sm text-pink-700 font-semibold bg-white/70 px-5 py-2.5 rounded-full border border-pink-200 shadow-inner flex items-center gap-2">
            <span>Mıncırma Sayısı:</span>
            <span id="counter" class="text-pink-600 font-black text-lg bg-pink-100 px-3 py-0.5 rounded-full border border-pink-300">0</span>
        </div>
    </div>

    <script>
        // DOM Elemanları
        const imageCard = document.getElementById('imageCard');
        const ardaImg = document.getElementById('ardaImg');
        const mincirBtn = document.getElementById('mincirBtn');
        const cornerPinchEmoji = document.getElementById('cornerPinchEmoji');
        const counterEl = document.getElementById('counter');
        const uploadImg = document.getElementById('uploadImg');
        const bgHeartsContainer = document.getElementById('bgHeartsContainer');

        let mincirCount = 0;

        // Arka Plan Yüzen Kalpleri Oluştur
        function initBgHearts() {
            const heartIcons = ['💖', '💗', '🌸', '💕', '✨'];
            for (let i = 0; i < 18; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (6 + Math.random() * 7) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.fontSize = (1.2 + Math.random() * 1.5) + 'rem';
                bgHeartsContainer.appendChild(heart);
            }
        }
        initBgHearts();

        // Web Audio API ile Mıncırma / Pop Sesi
        function playMincirSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                // Çift tonlu tatlı pop efekti
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, ctx.currentTime + 0.14);

                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.14);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.14);
            } catch (e) {
                // Ses çalınamazsa geç
            }
        }

        // Ana Mıncırma Eylemi
        function doMincir(e) {
            // 1. Sayaç Artır
            mincirCount++;
            counterEl.textContent = mincirCount;

            // 2. Ses Efekti
            playMincirSound();

            // 3. Fotoğraf Öne Gelip Geri Çekilsin
            imageCard.classList.remove('pop-forward');
            void imageCard.offsetWidth; // Reflow
            imageCard.classList.add('pop-forward');

            // 4. Köşedeki 🤏🏻 Emojisi Mıncırsın
            cornerPinchEmoji.classList.remove('pinch-squeeze');
            void cornerPinchEmoji.offsetWidth;
            cornerPinchEmoji.classList.add('pinch-squeeze');

            // 5. Ekran Geneline Kalpler ve Emojiler Saç
            const clickX = e ? e.clientX : window.innerWidth / 2;
            const clickY = e ? e.clientY : window.innerHeight / 2;
            createBurstParticles(clickX, clickY);
        }

        // Tıklanan Yere ve Fotoğrafa Uçuşan Kalpler Saçma
        function createBurstParticles(originX, originY) {
            const items = ['💖', '💕', '💗', '❤️', '✨', '🤏🏻', '🌸'];
            const particleCount = 10;

            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'burst-emoji';
                p.textContent = items[Math.floor(Math.random() * items.length)];

                // Rastgele yönler
                const angle = Math.random() * Math.PI * 2;
                const distance = 90 + Math.random() * 120;
                const dx = Math.cos(angle) * distance + 'px';
                const dy = Math.sin(angle) * distance + 'px';
                const rot = (Math.random() - 0.5) * 120 + 'deg';

                p.style.setProperty('--dx', dx);
                p.style.setProperty('--dy', dy);
                p.style.setProperty('--rot', rot);

                // Başlangıç Pozisyonu
                p.style.left = (originX - 16) + 'px';
                p.style.top = (originY - 16) + 'px';

                document.body.appendChild(p);

                setTimeout(() => {
                    p.remove();
                }, 1100);
            }
        }

        // Buton Tıklaması
        mincirBtn.addEventListener('click', (e) => {
            const rect = mincirBtn.getBoundingClientRect();
            doMincir({
                clientX: rect.left + rect.width / 2,
                clientY: rect.top + rect.height / 2
            });
        });

        // Dikdörtgen Fotoğrafa Tıklayınca da Mıncır
        imageCard.addEventListener('click', (e) => {
            doMincir(e);
        });
    </script>
</body>
</html>
