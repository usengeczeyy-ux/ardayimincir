<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arda'ya Mıncır!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: linear-gradient(180deg, #fff0f5 0%, #ffe4ec 50%, #ffd6e5 100%);
      font-family: 'Fredoka', 'Nunito', sans-serif;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    /* Üst Rozet */
    .top-badge {
      background: #e8dff5;
      color: #7b5ea7;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 20px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* Ana Başlık */
    .main-title {
      font-size: 38px;
      font-weight: 800;
      color: #ff3377;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Foto Kartı */
    .photo-card-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin-bottom: 24px;
    }

    .photo-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 16px 16px 12px 16px;
      box-shadow: 0 10px 25px rgba(255, 105, 180, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .photo-wrapper {
      width: 100%;
      height: 300px;
      border-radius: 20px;
      overflow: hidden;
      background: #f0f0f0;
      position: relative;
      cursor: pointer;
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name-label {
      font-size: 20px;
      font-weight: 800;
      color: #4a4a4a;
      margin-top: 10px;
    }

    /* Köşedeki 🤏🏻 Emojisi Rozeti */
    .pinch-badge {
      position: absolute;
      top: -12px;
      right: -12px;
      background: #ffffff;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      z-index: 10;
      animation: floatBadge 2.5s infinite ease-in-out;
    }

    @keyframes floatBadge {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.08); }
    }

    /* Öne fırlama animasyonu */
    .pop-forward {
      animation: popAndBack 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.3) !important;
    }

    @keyframes popAndBack {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); box-shadow: 0 20px 40px rgba(255, 51, 119, 0.3); }
      100% { transform: scale(1); }
    }

    /* Ses Seçim Alanı */
    .sound-box {
      width: 100%;
      max-width: 320px;
      border: 2px dashed #ffb6c1;
      border-radius: 24px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.5);
      margin-bottom: 24px;
    }

    .sound-box-title {
      font-size: 15px;
      font-weight: 700;
      color: #e6005c;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .radio-option {
      background: #fff0f5;
      border: 2px solid #ffccd5;
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .radio-option input[type="radio"] {
      accent-color: #ff3377;
      width: 18px;
      height: 18px;
    }

    .radio-option span {
      font-size: 16px;
      font-weight: 700;
      color: #555555;
    }

    /* Mıncır Butonu */
    .mincir-btn {
      width: 100%;
      max-width: 320px;
      background: #ff3377;
      color: #ffffff;
      border: none;
      padding: 18px;
      border-radius: 50px;
      font-size: 24px;
      font-weight: 800;
      font-family: 'Fredoka', sans-serif;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(255, 51, 119, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease;
    }

    .mincir-btn:active {
      transform: scale(0.96);
    }

    /* Sayaç */
    .counter {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
      color: #ff3377;
    }

    /* Patlayan Kalpler */
    .heart-particle {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      animation: explode 0.8s ease-out forwards;
      font-size: 26px;
    }

    @keyframes explode {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5); }
    }
  </style>
</head>
<body>

  <div class="top-badge">MINCIRMA SİTEMİZ</div>
  <h1 class="main-title">Arda'ya Mıncır!</h1>

  <div class="photo-card-container">
    <div class="pinch-badge">🤏🏻</div>
    <div class="photo-card" id="photo-card">
      <div class="photo-wrapper" id="photo-click">
        <img src="HVbmCDJWMAEtK1r.jpg" alt="Arda">
      </div>
      <div class="name-label">Arda</div>
    </div>
  </div>

  <div class="sound-box">
    <div class="sound-box-title">🎵 Mıncırma Sesi Seç</div>
    <label class="radio-option">
      <input type="radio" name="sound" checked>
      <span>a aa lets go mu🥺</span>
    </label>
  </div>

  <button class="mincir-btn" id="mincir-btn">
    ❤️ Arda'yı Mıncır!
  </button>

  <div class="counter">Toplam Mıncırma: <span id="count">0</span></div>

  <script>
    const btn = document.getElementById('mincir-btn');
    const photoCard = document.getElementById('photo-card');
    const photoClick = document.getElementById('photo-click');
    const countEl = document.getElementById('count');

    // GitHub'daki ses dosyasının tam adı:
    const letsGoAudio = new Audio('2099898975721488384.mp3');

    let count = 0;

    function playSound() {
      letsGoAudio.currentTime = 0;
      letsGoAudio.play().catch(() => {});
    }

    function createHearts(x, y) {
      const items = ['💖', '💕', '💗', '💓', '🤏🏻', '✨'];
      for (let i = 0; i < 10; i++) {
        const p = document.createElement('div');
        p.className = 'heart-particle';
        p.innerText = items[Math.floor(Math.random() * items.length)];
        
        const angle = (Math.PI * 2 * i) / 10;
        const dist = 70 + Math.random() * 50;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    function doMincir(e) {
      count++;
      countEl.innerText = count;

      photoCard.classList.remove('pop-forward');
      void photoCard.offsetWidth;
      photoCard.classList.add('pop-forward');

      const rect = photoCard.getBoundingClientRect();
      const clickX = e.clientX || rect.left + rect.width / 2;
      const clickY = e.clientY || rect.top + rect.height / 2;

      createHearts(clickX, clickY);
      playSound();
    }

    btn.addEventListener('click', doMincir);
    photoClick.addEventListener('click', doMincir);
  </script>
</body>
</html>
